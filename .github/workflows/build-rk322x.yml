name: Build ImmortalWrt for HK1Mini RK3229

on:
  push:
    branches: [ rk322x ]
  pull_request:
    branches: [ rk322x ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ubuntu:22.04

    steps:
    - name: Checkout ImmortalWrt source
      uses: actions/checkout@v4
      with:
        repository: pitekkate/immortalwrt
        ref: rk322x  # Menggunakan branch khusus RK322x
        submodules: recursive
        path: immortalwrt

    - name: Prepare HK1Mini support files
      working-directory: ./immortalwrt
      run: |
        # Create ARMv7 directory structure
        mkdir -p target/linux/rockchip/armv7/{config,image,base-files/etc/board.d,patches-6.1}
        
        # Add Makefile for ARMv7 subtarget
        cat << EOF > target/linux/rockchip/armv7/Makefile
        ARCH:=arm
        BOARD:=rockchip
        BOARDNAME:=Rockchip ARMv7
        FEATURES:=usb rtc nand gpio
        SUBTARGETS:=armv7
        KERNEL_PATCHVER:=6.1
        
        define Target/Description
          Build images for Rockchip ARMv7 devices (RK322x)
        endef
        EOF
        
        # Add device profile
        cat << EOF > target/linux/rockchip/armv7/image/armv7.mk
        include \$(TOPDIR)/rules.mk
        include \$(INCLUDE_DIR)/image.mk
        
        define Device/hk1mini-rk3229
          DEVICE_VENDOR := HK1
          DEVICE_MODEL := Mini (RK3229)
          SOC := rk3229
          UBOOT_DEVICE_NAME := rk3229-box
          IMAGES := sysupgrade.img.gz
          IMAGE/sysupgrade.img.gz := append-ubi | gzip
        endef
        TARGET_DEVICES += hk1mini-rk3229
        EOF
        
        # Add network config
        mkdir -p target/linux/rockchip/armv7/base-files/etc/board.d
        cat << "EOF" > target/linux/rockchip/armv7/base-files/etc/board.d/02_network
        #!/bin/sh
        . /lib/functions/uci-defaults.sh
        board_config_update
        case "$(board_name)" in
        hk1mini-rk3229)
            ucidef_set_interface_lan "eth0"
            ;;
        esac
        board_config_flush
        EOF
        chmod +x target/linux/rockchip/armv7/base-files/etc/board.d/02_network
        
        # Add DTS patch
        cat << "EOF" > target/linux/rockchip/armv7/patches-6.1/1000-add-hk1mini-dts.patch
        [Isi patch DTS HK1Mini di sini]
        EOF
        echo "1000-add-hk1mini-dts.patch" >> target/linux/rockchip/armv7/patches-6.1/series

    - name: Install build dependencies
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip \
          zlib1g-dev file wget curl ca-certificates upx-ucl jq

    - name: Setup build environment
      working-directory: ./immortalwrt
      run: |
        echo "FORCE_UNSAFE_CONFIGURE=1" >> $GITHUB_ENV
        ulimit -n 1024
        [ -d staging_dir/host ] || mkdir -p staging_dir/host

    - name: Prepare configuration
      working-directory: ./immortalwrt
      run: |
        # Set default config for HK1Mini
        cat > .config << EOF
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv7=y
        CONFIG_TARGET_rockchip_armv7_DEVICE_hk1mini-rk3229=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-compat=y
        CONFIG_PACKAGE_luci-proto-ipv6=y
        CONFIG_PACKAGE_luci-proto-ppp=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        # Kernel modules
        CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
        CONFIG_PACKAGE_kmod-rtl8723bs=y
        CONFIG_PACKAGE_iw=y
        CONFIG_PACKAGE_wpa-cli=y
        # Utilities
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_tmux=y
        CONFIG_PACKAGE_curl=y
        EOF

    - name: Verify RK3229 target configuration
      working-directory: ./immortalwrt
      run: |
        # Check if target is Rockchip ARMv7
        if ! grep -q 'CONFIG_TARGET_rockchip_armv7=y' .config; then
          echo "::error::❌ Target architecture is not Rockchip ARMv7!"
          echo "Current target: $(grep 'CONFIG_TARGET' .config || echo 'Not found')"
          echo "Skipping build process"
          exit 1
        fi
        
        # Check if specific device is HK1Mini RK3229
        if ! grep -q 'CONFIG_TARGET_rockchip_armv7_DEVICE_hk1mini-rk3229=y' .config; then
          echo "::error::❌ Target device is not HK1Mini RK3229!"
          echo "Current device: $(grep 'CONFIG_TARGET_rockchip_armv7_DEVICE' .config || echo 'Not found')"
          echo "Skipping build process"
          exit 1
        fi
        
        echo "::notice::✅ Target verified: HK1Mini RK3229 (ARMv7)"
        echo "Proceeding with build..."

    - name: Update feeds
      working-directory: ./immortalwrt
      if: ${{ success() || failure() }}  # Run even if previous step failed (for debugging)
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Build firmware
      working-directory: ./immortalwrt
      if: ${{ success() }}  # Only run if verification succeeded
      run: |
        make defconfig
        make download -j8
        make -j$(($(nproc) + 1)) V=s

    - name: Archive firmware
      working-directory: ./immortalwrt
      if: ${{ success() }}  # Only run if build succeeded
      run: |
        mkdir -p artifacts
        cp bin/targets/rockchip/armv7/*.img.gz artifacts/
        cp bin/targets/rockchip/armv7/*.manifest artifacts/

    - name: Upload firmware artifacts
      if: ${{ success() }}  # Only upload if build succeeded
      uses: actions/upload-artifact@v4
      with:
        name: hk1mini-firmware
        path: immortalwrt/artifacts/*
        retention-days: 7

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: always() && ${{ failure() }}  # Only upload on failure
      with:
        name: build-logs
        path: |
          immortalwrt/logs/*.log
          immortalwrt/build_dir/*/log.txt
        retention-days: 3
