name: Build ImmortalWrt for HK1Mini RK3229

on:
  push:
    branches: [ rk322x ]
  pull_request:
    branches: [ rk322x ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout ImmortalWrt source
      uses: actions/checkout@v4
      with:
        repository: pitekkate/immortalwrt
        # Menggunakan branch yang valid dan tersedia
        ref: openwrt-23.05
        submodules: recursive
        # Meningkatkan depth fetch untuk memastikan semua branch terambil
        fetch-depth: 0
        # Mengatasi masalah safe directory
        set-safe-directory: true
        # Menambahkan token akses
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Add HK1Mini support files
      run: |
        # Membuat struktur direktori
        mkdir -p target/linux/rockchip/armv7/{config,image,base-files/etc/board.d,patches-6.1}
        
        # File Makefile untuk ARMv7
        cat << EOF > target/linux/rockchip/armv7/Makefile
        ARCH:=arm
        BOARD:=rockchip
        BOARDNAME:=Rockchip ARMv7
        FEATURES:=usb rtc nand gpio
        SUBTARGETS:=armv7
        KERNEL_PATCHVER:=6.1
        
        define Target/Description
          Build images for Rockchip ARMv7 devices (RK322x)
        endef
        EOF
        
        # Profil perangkat HK1Mini
        cat << EOF > target/linux/rockchip/armv7/image/armv7.mk
        include \$(TOPDIR)/rules.mk
        include \$(INCLUDE_DIR)/image.mk
        
        define Device/hk1mini-rk3229
          DEVICE_VENDOR := HK1
          DEVICE_MODEL := Mini (RK3229)
          SOC := rk3229
          UBOOT_DEVICE_NAME := rk3229-box
          IMAGES := sysupgrade.img.gz
          IMAGE/sysupgrade.img.gz := append-ubi | gzip
        endef
        TARGET_DEVICES += hk1mini-rk3229
        EOF
        
        # Konfigurasi jaringan
        cat << "EOF" > target/linux/rockchip/armv7/base-files/etc/board.d/02_network
        #!/bin/sh
        . /lib/functions/uci-defaults.sh
        board_config_update
        case "\$(board_name)" in
        hk1mini-rk3229)
            ucidef_set_interface_lan "eth0"
            ;;
        esac
        board_config_flush
        EOF
        chmod +x target/linux/rockchip/armv7/base-files/etc/board.d/02_network
        
        # Menambahkan patch DTS
        cat << "EOF" > target/linux/rockchip/armv7/patches-6.1/1000-add-hk1mini-dts.patch
        [Isi patch DTS HK1Mini di sini]
        EOF
        echo "1000-add-hk1mini-dts.patch" >> target/linux/rockchip/armv7/patches-6.1/series

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip \
          zlib1g-dev file wget curl ca-certificates

    - name: Setup build environment
      run: |
        echo "FORCE_UNSAFE_CONFIGURE=1" >> $GITHUB_ENV
        ulimit -n 1024

    - name: Prepare configuration
      run: |
        # Membuat konfigurasi default
        cat > .config << EOF
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv7=y
        CONFIG_TARGET_rockchip_armv7_DEVICE_hk1mini-rk3229=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-compat=y
        CONFIG_PACKAGE_luci-proto-ipv6=y
        CONFIG_PACKAGE_luci-proto-ppp=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        EOF

    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Build firmware
      run: |
        make defconfig
        make download -j8
        make -j$(($(nproc) + 1)) V=s

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: hk1mini-firmware
        path: bin/targets/rockchip/armv7/*.img.gz
        retention-days: 7

    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          logs/*.log
          build_dir/*/log.txt
        retention-days: 3
